<svg width="1320" height="880" viewBox="0 0 1320 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="1320" y1="0" x2="0" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B5AC8"/>
      <stop offset="100%" stop-color="#2B2F7E"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="880" fill="url(#bg)"/>

  <!-- Insighty logo centered, scaled to ~700px wide -->
  <g transform="translate(310 353) scale(3.93)">
    <!-- Mark: ascending bars -->
    <rect x="0"  y="32" width="6" height="10" rx="2" fill="white" opacity="0.4"/>
    <rect x="9"  y="25" width="6" height="17" rx="2" fill="white" opacity="0.6"/>
    <rect x="18" y="17" width="6" height="25" rx="2" fill="white" opacity="0.8"/>
    <rect x="27" y="9"  width="6" height="33" rx="2" fill="white"/>
    <!-- Gold dot -->
    <circle cx="30" cy="5" r="3.5" fill="#d4a574"/>
    <!-- Wordmark -->
    <text
      x="45"
      y="32"
      font-family="'Inter Tight', 'Helvetica Neue', Arial, sans-serif"
      font-size="26"
      font-weight="700"
      letter-spacing="-0.3"
      fill="white"
    >insighty</text>
  </g>
</svg>
