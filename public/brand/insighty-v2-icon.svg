<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Insighty icon">
  <title>Insighty icon</title>
  <defs>
    <!-- 8 rays: each fades from navy at center to transparent at tip -->
    <linearGradient id="r1" x1="50" y1="50" x2="64" y2="3"   gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1b3a6b"/><stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r2" x1="50" y1="50" x2="12" y2="18"  gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1b3a6b"/><stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r3" x1="50" y1="50" x2="4"  y2="46"  gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1b3a6b"/><stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r4" x1="50" y1="50" x2="7"  y2="66"  gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1b3a6b"/><stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r5" x1="50" y1="50" x2="22" y2="92"  gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1b3a6b"/><stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r6" x1="50" y1="50" x2="46" y2="97"  gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1b3a6b"/><stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r7" x1="50" y1="50" x2="84" y2="14"  gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1b3a6b"/><stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/></linearGradient>
    <linearGradient id="r8" x1="50" y1="50" x2="93" y2="50"  gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#1b3a6b"/><stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/></linearGradient>
    <!-- bullseye center: white core → royal blue → dark navy -->
    <radialGradient id="rc" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#4a6ec7"/>
      <stop offset="100%" stop-color="#1b3a6b"/>
    </radialGradient>
  </defs>
  <!-- asymmetric rays: heavy cluster upper-left, lighter right -->
  <g stroke-linecap="butt">
    <line x1="50" y1="50" x2="64" y2="3"  stroke="url(#r1)" stroke-width="2.5"/>
    <line x1="50" y1="50" x2="12" y2="18" stroke="url(#r2)" stroke-width="2.8"/>
    <line x1="50" y1="50" x2="4"  y2="46" stroke="url(#r3)" stroke-width="2.8"/>
    <line x1="50" y1="50" x2="7"  y2="66" stroke="url(#r4)" stroke-width="2.4"/>
    <line x1="50" y1="50" x2="22" y2="92" stroke="url(#r5)" stroke-width="2.5"/>
    <line x1="50" y1="50" x2="46" y2="97" stroke="url(#r6)" stroke-width="2.4"/>
    <line x1="50" y1="50" x2="84" y2="14" stroke="url(#r7)" stroke-width="2.0"/>
    <line x1="50" y1="50" x2="93" y2="50" stroke="url(#r8)" stroke-width="1.6"/>
  </g>
  <!-- outer ring + bullseye center -->
  <circle cx="50" cy="50" r="8.5" fill="#a3b8ea"/>
  <circle cx="50" cy="50" r="5.5" fill="url(#rc)"/>
</svg>
