          - strong [ref=e100]: "Key Features:"
        - list [ref=e101]:
          - listitem [ref=e102]: Customizable project workflows and dashboards.
          - listitem [ref=e103]: Time tracking and workload management.
          - listitem [ref=e104]: CRM and pipeline management modules.
          - listitem [ref=e105]: Automation recipes for recurring tasks and notifications.
          - listitem [ref=e106]: Integration with finance tools for invoicing via third-party apps.
        - paragraph [ref=e107]:
